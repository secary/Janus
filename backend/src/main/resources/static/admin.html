<!DOCTYPE html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Janus 管理</title>
    <style>
      :root {
        --page-background: #eef2f5;
        --surface: #ffffff;
        --surface-soft: #f7f9fb;
        --border: #d6dde6;
        --text: #223042;
        --muted: #667085;
        --primary: #176b87;
        --primary-hover: #12566c;
        --danger: #c2410c;
        --success: #047857;
        --shadow: 0 1px 2px rgba(16, 24, 40, 0.06);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        font-family: "Segoe UI", sans-serif;
        background: var(--page-background);
        color: var(--text);
        line-height: 1.4;
      }

      .page {
        width: min(1280px, calc(100% - 32px));
        margin: 0 auto;
        padding: 22px 0 36px;
      }

      .topbar,
      .toolbar,
      .section-header,
      .form-row {
        display: flex;
        align-items: center;
        gap: 12px;
      }

      .topbar {
        justify-content: space-between;
        margin-bottom: 16px;
      }

      h1,
      h2 {
        margin: 0;
        color: var(--text);
      }

      h1 {
        font-size: 24px;
        line-height: 1.2;
      }

      h2 {
        font-size: 16px;
        line-height: 1.25;
      }

      nav {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      a {
        color: var(--primary);
        text-decoration: none;
        font-weight: 600;
      }

      a:hover {
        text-decoration: underline;
      }

      .toolbar {
        flex-wrap: wrap;
        margin-bottom: 14px;
      }

      button,
      select,
      input {
        height: 36px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #fff;
        color: var(--text);
        font: inherit;
      }

      button {
        padding: 0 14px;
        border-color: var(--primary);
        background: var(--primary);
        color: #fff;
        cursor: pointer;
        font-weight: 600;
      }

      button:hover:not(:disabled) {
        background: var(--primary-hover);
      }

      button.secondary {
        background: #fff;
        color: var(--primary);
      }

      button:disabled {
        opacity: 0.65;
        cursor: not-allowed;
      }

      select,
      input {
        padding: 0 10px;
      }

      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .status-text {
        min-height: 20px;
        color: var(--muted);
        font-size: 14px;
      }

      .status-text[data-tone="success"] {
        color: var(--success);
      }

      .status-text[data-tone="error"] {
        color: var(--danger);
      }

      .summary-grid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
        margin-bottom: 14px;
      }

      .summary-card,
      .panel {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 8px;
        box-shadow: var(--shadow);
      }

      .summary-card {
        padding: 14px;
        min-height: 86px;
      }

      .summary-label {
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
      }

      .summary-value {
        margin-top: 8px;
        font-size: 24px;
        font-weight: 700;
      }

      .dashboard-grid {
        display: grid;
        grid-template-columns: minmax(0, 2fr) minmax(320px, 1fr);
        gap: 14px;
        align-items: start;
      }

      .panel {
        overflow: hidden;
      }

      .section-header {
        justify-content: space-between;
        padding: 14px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface-soft);
      }

      .panel-body {
        padding: 14px 16px 16px;
      }

      .stack {
        display: grid;
        gap: 14px;
      }

      .table-wrap {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        min-width: 860px;
      }

      th,
      td {
        padding: 10px 12px;
        border-bottom: 1px solid var(--border);
        text-align: left;
        vertical-align: middle;
        font-size: 14px;
      }

      th {
        color: #344054;
        background: #edf1f5;
        font-weight: 700;
        white-space: nowrap;
      }

      tr:last-child td {
        border-bottom: none;
      }

      tr:hover td {
        background: #fafbfc;
      }

      .job-name {
        font-weight: 700;
        margin-bottom: 3px;
      }

      .muted {
        color: var(--muted);
        font-size: 13px;
      }

      .nowrap {
        white-space: nowrap;
      }

      .enabled-input {
        width: 18px;
        height: 18px;
        margin: 0;
      }

      .cron-control {
        display: grid;
        grid-template-columns: minmax(150px, 1fr) 132px;
        gap: 8px;
        align-items: center;
      }

      .cron-input {
        width: 100%;
        min-width: 0;
        font-family: Consolas, "Courier New", monospace;
      }

      .cron-input.invalid {
        border-color: var(--danger);
        outline: 2px solid rgba(194, 65, 12, 0.14);
      }

      .export-grid,
      .prediction-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 12px;
      }

      .form-row {
        justify-content: flex-start;
        flex-wrap: wrap;
        margin-top: 12px;
      }

      .full-width {
        grid-column: 1 / -1;
      }

      .panel select,
      .panel input {
        width: 100%;
        min-width: 0;
      }

      @media (max-width: 980px) {
        .summary-grid,
        .dashboard-grid {
          grid-template-columns: 1fr;
        }

        .export-grid,
        .prediction-grid {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 700px) {
        .page {
          width: min(100% - 20px, 1280px);
          padding-top: 16px;
        }

        .topbar {
          align-items: flex-start;
          flex-direction: column;
        }

        h1 {
          font-size: 22px;
        }
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page-background: #121212;
          --surface: #1e1e1e;
          --surface-soft: #242424;
          --border: #3a3a3a;
          --text: #eceff1;
          --muted: #a6a6a6;
          --primary: #4ea4bd;
          --primary-hover: #3f8fa6;
          --danger: #fb923c;
          --success: #34d399;
          --shadow: none;
        }

        button,
        select,
        input {
          background: #242424;
          color: var(--text);
        }

        button {
          background: var(--primary);
          color: #071216;
        }

        button.secondary {
          background: #242424;
          color: var(--primary);
        }

        th {
          background: #272727;
          color: #d9e1e8;
        }

        tr:hover td {
          background: #232323;
        }
      }
    </style>
    <script type="module" src="/assets/admin.js"></script>
  </head>
  <body>
    <div class="page">
      <header class="topbar">
        <h1>Janus 管理</h1>
        <nav>
          <a href="/">仪表盘</a>
          <a href="/history">历史记录</a>
        </nav>
      </header>

      <main>
        <div class="toolbar">
          <button type="button" id="saveButton">保存配置</button>
          <button type="button" id="reloadButton" class="secondary">重新加载</button>
          <span id="statusText" class="status-text" role="status"></span>
        </div>

        <section class="summary-grid" aria-label="状态摘要">
          <div class="summary-card">
            <div class="summary-label">调度任务</div>
            <div class="summary-value" id="taskCount">-</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">启用任务</div>
            <div class="summary-value" id="enabledCount">-</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">预测方法</div>
            <div class="summary-value" id="predictionMethodSummary">-</div>
          </div>
          <div class="summary-card">
            <div class="summary-label">预测天数</div>
            <div class="summary-value" id="horizonSummary">-</div>
          </div>
        </section>

        <div class="dashboard-grid">
          <section class="panel">
            <div class="section-header">
              <h2>调度控制</h2>
              <span id="scheduleStatus" class="status-text"></span>
            </div>
            <div class="table-wrap">
              <table id="scheduleTable">
                <thead>
                  <tr>
                    <th>任务</th>
                    <th>启用</th>
                    <th>频率</th>
                    <th>说明</th>
                    <th>更新时间</th>
                  </tr>
                </thead>
                <tbody></tbody>
              </table>
            </div>
          </section>

          <div class="stack">
            <section class="panel">
              <div class="section-header">
                <h2>预测设置</h2>
                <span id="predictionStatus" class="status-text"></span>
              </div>
              <div class="panel-body">
                <div class="prediction-grid">
                  <label>
                    方法
                    <select id="predictionMethod">
                      <option value="lstm">LSTM</option>
                      <option value="last_observed">Last observed</option>
                    </select>
                  </label>
                  <label>
                    天数
                    <input id="predictionHorizon" type="number" min="1" max="30" step="1" value="7" />
                  </label>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="section-header">
                <h2>数据导出</h2>
              </div>
              <div class="panel-body">
                <div class="export-grid">
                  <label>
                    数据集
                    <select id="dataExportDataset">
                      <option value="history">历史汇率</option>
                      <option value="prediction">预测结果</option>
                    </select>
                  </label>
                  <label>
                    币种
                    <select id="dataExportCurrency">
                      <option value="">全部</option>
                      <option value="AUD">AUD</option>
                      <option value="JPY">JPY</option>
                      <option value="USD">USD</option>
                    </select>
                  </label>
                  <label class="full-width">
                    条数
                    <input id="dataExportLimit" type="number" min="1" max="10000" step="100" value="1000" />
                  </label>
                </div>
                <div class="form-row">
                  <button type="button" id="exportDataButton" class="secondary">导出数据</button>
                </div>
              </div>
            </section>

            <section class="panel">
              <div class="section-header">
                <h2>日志导出</h2>
              </div>
              <div class="panel-body">
                <div class="export-grid">
                  <label>
                    来源
                    <select id="logExportSource">
                      <option value="">全部</option>
                      <option value="janus">janus</option>
                      <option value="jervis">jervis</option>
                    </select>
                  </label>
                  <label>
                    级别
                    <select id="logExportLevel">
                      <option value="">全部</option>
                      <option value="INFO">INFO</option>
                      <option value="WARNING">WARNING</option>
                      <option value="ERROR">ERROR</option>
                      <option value="CRITICAL">CRITICAL</option>
                    </select>
                  </label>
                  <label class="full-width">
                    条数
                    <input id="logExportLimit" type="number" min="1" max="10000" step="100" value="1000" />
                  </label>
                </div>
                <div class="form-row">
                  <button type="button" id="exportLogsButton" class="secondary">导出日志</button>
                </div>
              </div>
            </section>
          </div>
        </div>
      </main>
    </div>
  </body>
</html>
