<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Janus</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #172033;
      background: #f5f7fb;
    }

    main {
      width: min(520px, calc(100% - 32px));
      padding: 32px;
      border: 1px solid #d8deea;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 12px 32px rgba(23, 32, 51, 0.08);
    }

    h1 {
      margin: 0 0 12px;
      font-size: 32px;
      letter-spacing: 0;
    }

    p {
      margin: 0 0 20px;
      line-height: 1.6;
      color: #4b5874;
    }

    a {
      color: #1f6feb;
      font-weight: 600;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <main>
    <h1>Janus</h1>
    <p>Spring Boot API is running. The legacy Flask pages are ready to be migrated into this service.</p>
    <a href="/api/health">Health check</a>
  </main>
</body>
</html>
