
services:
  javelin:
    build:
      context: .
      dockerfile: ./dockerfile.javelin
    image: web
    container_name: javelin 
    ports:
      - "5024:5000"
    env_file:
      - .env.prod
    volumes:
      - ./web/app/routes.py:/Javelin/web/app/routes.py
      - ./web/app/templates:/Javelin/web/app/templates
    restart: always

  janus:
    build:
      context: .
      dockerfile: ./dockerfile.janus
    image: crawler
    container_name: janus
    env_file:
      - .env.prod
    volumes:
      - ./main:/Janus/main
      - ./config:/Janus/config
      - ./utils:/Janus/utils
    restart: "no"

  jervis:
    build:
      context: .
      dockerfile: ./dockerfile.jervis
    image: predictor 
    container_name: jervis
    env_file:
      - .env.prod
    volumes:
      - ./predictor:/Jervis/predictor
      - ./config:/Jervis/config
      - ./utils:/Jervis/utils
    restart: "no"
