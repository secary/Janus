
services:
  exchange-rate:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: exchange-rate
    container_name: janus
    ports:
      - "5024:5000"
    env_file:
      - .env
    environment:
      DB_HOST: host.docker.internal
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./predictor/models:/app/predictor/models
      - ./scripts:/app/scripts:ro
    command: ["sh", "/app/scripts/docker-entrypoint.sh"]
    restart: always
