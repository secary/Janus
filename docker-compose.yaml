
services:
  api:
    build:
      context: ./backend
      dockerfile: ./Dockerfile
    image: janus-api
    container_name: janus-api
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./backend/src/main/resources/static:/app/static:ro
    restart: always

  worker:
    build:
      context: .
      dockerfile: ./Dockerfile
    image: janus-worker
    container_name: janus-worker
    env_file:
      - .env
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-3306}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data:/app/data
      - ./predictor/models:/app/predictor/models
      - ./scripts:/app/scripts:ro
    restart: always
