repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: backend-maven-compile
        name: backend Maven compile
        entry: sh backend/mvnw -q -f backend/pom.xml -DskipTests test-compile
        language: system
        pass_filenames: false
        files: ^backend/(pom\.xml|src/.*\.(java|properties|xml|ya?ml|json|ts|html|css))$
